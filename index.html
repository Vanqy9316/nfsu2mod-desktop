<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Need for Speed: Underground 2 — Underground 2 Revived (modded)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0d;
      --surface: #171717;
      --line: #3a3a3a;
      --line-2: #8a8a8a;
      --text: #ffffff;
      --muted: #c4c4c4;
      --accent: #ffa94d;
      --accent-dim: #443626;
      --accent-glow: rgba(255, 169, 77, 0.45);
      --danger: #ff8a80;
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: radial-gradient(900px 600px at 85% 900px, rgba(255, 169, 77, 0.05), transparent 70%) no-repeat fixed var(--bg);
      color: var(--text);
      font: 15px/1.55 var(--sans);
      overflow: hidden;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 20px;
    }

    .brand {
      font: 700 15px/1 var(--sans);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brand b {
      color: var(--accent);
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font: italic 900 clamp(28px, 5vw, 48px)/1.08 var(--sans);
      letter-spacing: 0.04em;
      color: #ffffff;
      text-transform: uppercase;
    }

    h1 span {
      display: block;
      margin-top: 6px;
      font-size: 0.6em;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-shadow: 0 0 28px var(--accent-glow), 0 4px 24px rgba(0, 0, 0, 0.6);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.05em;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .dot.err {
      background: var(--danger);
      box-shadow: 0 0 10px var(--danger);
      animation: none;
    }

    @keyframes pulse {
      50% {
        opacity: 0.35;
      }
    }

    button {
      margin-top: 8px;
      padding: 11px 26px;
      font: italic 700 13px var(--sans);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #0d0d0d;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background: #ffc788;
      transform: translateY(-1px);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="brand">Underground 2 <b>Revived</b></div>
  <h1>Need for Speed <span>Underground 2</span></h1>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="msg">Connecting to server…</span>
  </div>
  <button type="button" id="retry" hidden>Retry Connection</button>

  <script>
    const TARGET_URL = 'https://nfsu2mod.xyz/';
    const params = new URLSearchParams(window.location.search);
    const isError = params.get('error') === '1';
    const dot = document.getElementById('dot');
    const msg = document.getElementById('msg');
    const retryBtn = document.getElementById('retry');

    function connect() {
      dot.className = 'dot';
      msg.textContent = 'Connecting to Underground 2 Revived…';
      retryBtn.hidden = true;
      if (window.electronAPI && window.electronAPI.loadSite) {
        window.electronAPI.loadSite(TARGET_URL);
      } else {
        window.location.href = TARGET_URL;
      }
    }

    retryBtn.addEventListener('click', connect);

    if (isError) {
      dot.className = 'dot err';
      msg.textContent = 'Could not reach nfsu2mod.xyz. Check your internet connection.';
      retryBtn.hidden = false;
    } else {
      connect();
    }
  </script>
</body>

</html>
